<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - HomeCarely</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231068eb'><path d='M12 2L2 7v7c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm-1 15l-4-4 1.41-1.41L11 14.17l6.59-6.59L19 9l-8 8z'/></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="bg-soft-blue d-flex flex-column min-vh-100 justify-content-between">

  <!-- Header -->
  <header class="py-3 border-bottom bg-white">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="brand-logo text-decoration-none" href="../index.html">
        <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
        <span>HomeCare<span class="text-primary">ly</span></span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-icon-pill theme-toggle-btn" title="Toggle Theme"><i class="bi bi-moon-stars-fill"></i></button>
        <button class="btn btn-sm btn-outline-hc dir-toggle-btn"><span class="dir-toggle-text">RTL</span></button>
      </div>
    </div>
  </header>

  <main class="my-auto py-5">
    <div class="container" style="max-width: 480px;">
      <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 bg-white">
        <div class="text-center mb-4">
          <div class="stat-icon blue mx-auto mb-3" style="width: 58px; height: 58px;">
            <i class="bi bi-key-fill fs-3"></i>
          </div>
          <h3 class="fw-bold mb-1">Forgot Password?</h3>
          <p class="text-muted small">Enter the email associated with your HomeCarely account and we'll send you an instant reset verification code.</p>
        </div>

        <form id="forgotPassForm" onsubmit="event.preventDefault(); showToast('Reset instructions sent to your email! (Demo Simulation)', 'success', 'Password Reset'); setTimeout(() => window.location.href='login.html', 1500);">
          <div class="mb-4">
            <label class="form-label small fw-semibold">Email Address</label>
            <div class="input-icon-group">
              <i class="bi bi-envelope"></i>
              <input type="email" class="form-control form-control-hc" placeholder="name@example.com" value="demo@homecarely.com" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-hc w-100 justify-content-center py-3 mb-3">
            Send Reset Instructions <i class="bi bi-arrow-right"></i>
          </button>

          <div class="text-center">
            <a href="login.html" class="text-muted small fw-semibold text-decoration-none">
              <i class="bi bi-arrow-left me-1"></i> Back to Log In
            </a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-3 border-top text-center text-muted small bg-white">
    <div class="container">
      © 2026 HomeCarely AMC Services Ltd.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/validation.js"></script>
</body>
</html>
