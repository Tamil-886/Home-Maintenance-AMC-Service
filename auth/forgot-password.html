<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - HomeCarely</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231068eb'><path d='M12 2L2 7v7c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm-1 15l-4-4 1.41-1.41L11 14.17l6.59-6.59L19 9l-8 8z'/></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="bg-soft-blue d-flex flex-column min-vh-100 justify-content-between">

  <!-- Header -->
  <header class="py-3 border-bottom bg-white auth-header">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="brand-logo text-decoration-none" href="../index.html">
        <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
        <span>HomeCare<span class="text-primary">ly</span></span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <!-- RTL / LTR Direction Switcher -->
        <button class="btn btn-sm btn-outline-hc dir-toggle-btn py-1-5 px-3 small d-inline-flex align-items-center" title="Toggle RTL / LTR layout" aria-label="Toggle RTL / LTR">
          <i class="bi bi-globe me-1 text-primary"></i> <span class="dir-toggle-text">RTL</span>
        </button>

        <!-- Dark Mode Toggle Button -->
        <button class="btn btn-icon-pill theme-toggle-btn d-inline-flex" title="Toggle Theme" aria-label="Toggle Dark Mode">
          <i class="bi bi-moon-stars-fill text-primary"></i>
        </button>

        <a href="login.html" class="btn btn-sm btn-outline-hc ms-1 d-inline-flex align-items-center gap-1">
          <i class="bi bi-box-arrow-in-right"></i> <span>Log In</span>
        </a>
      </div>
    </div>
  </header>

  <main class="my-auto py-5">
    <div class="container" style="max-width: 480px;">
      <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 bg-white auth-card">
        <div class="text-center mb-4">
          <div class="stat-icon blue mx-auto mb-3" style="width: 58px; height: 58px;">
            <i class="bi bi-key-fill fs-3"></i>
          </div>
          <h3 class="fw-bold mb-1">Forgot Password?</h3>
          <p class="text-muted small">Enter the email associated with your HomeCarely account and we'll send you an instant reset verification code.</p>
        </div>

        <form id="forgotPassForm">
          <div class="mb-4">
            <label class="form-label small fw-semibold">Email Address</label>
            <div class="input-icon-group">
              <i class="bi bi-envelope"></i>
              <input type="email" class="form-control form-control-hc" id="resetEmail" placeholder="name@example.com" value="demo@homecarely.com" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-hc w-100 justify-content-center py-3 mb-3">
            Send Reset Instructions <i class="bi bi-arrow-right"></i>
          </button>

          <div class="text-center">
            <a href="login.html" class="text-muted small fw-semibold text-decoration-none">
              <i class="bi bi-arrow-left me-1"></i> Back to Log In
            </a>
          </div>
        </form>

        <!-- Step 2: Set New Password & Confirm Password -->
        <form id="setNewPasswordForm" class="d-none">
          <div class="alert alert-success small mb-3 py-2 px-3">
            <i class="bi bi-check-circle me-1"></i> Identity verified! Set your new password below.
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold" for="resetPassword">New Password</label>
            <div class="input-icon-group">
              <i class="bi bi-lock"></i>
              <input type="password" class="form-control form-control-hc" id="resetPassword" placeholder="Min. 8 characters" minlength="8" required autocomplete="new-password">
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('#resetPassword', '#resetPassToggleIcon')" title="Toggle password visibility" tabindex="-1">
                <i class="bi bi-eye" id="resetPassToggleIcon"></i>
              </button>
            </div>
            <div id="resetPassFeedback" class="small mt-1" style="min-height: 1.25rem;"></div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold" for="resetConfirmPassword">Confirm New Password (Re-enter)</label>
            <div class="input-icon-group">
              <i class="bi bi-shield-lock"></i>
              <input type="password" class="form-control form-control-hc" id="resetConfirmPassword" placeholder="Re-enter new password" minlength="8" required autocomplete="new-password">
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('#resetConfirmPassword', '#resetConfirmPassToggleIcon')" title="Toggle password visibility" tabindex="-1">
                <i class="bi bi-eye" id="resetConfirmPassToggleIcon"></i>
              </button>
            </div>
            <div id="resetConfirmPassFeedback" class="small mt-1" style="min-height: 1.25rem;"></div>
          </div>

          <button type="submit" class="btn btn-primary-hc w-100 justify-content-center py-3 mb-3">
            Update Password & Sign In <i class="bi bi-arrow-right"></i>
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-3 border-top text-center text-muted small bg-white auth-footer">
    <div class="container">
      © 2026 HomeCarely AMC Services Ltd.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/validation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const step1Form = document.getElementById('forgotPassForm');
      const step2Form = document.getElementById('setNewPasswordForm');

      if (step1Form) {
        step1Form.addEventListener('submit', function (e) {
          e.preventDefault();
          if (window.showToast) {
            window.showToast('Verification code confirmed! Please choose a new password.', 'success', 'Identity Confirmed');
          }
          step1Form.classList.add('d-none');
          step2Form.classList.remove('d-none');
          if (window.initPasswordMatchValidator) {
            window.initPasswordMatchValidator('#resetPassword', '#resetConfirmPassword', '#resetPassFeedback', '#resetConfirmPassFeedback');
          }
          document.getElementById('resetPassword').focus();
        });
      }

      if (step2Form) {
        step2Form.addEventListener('submit', function (e) {
          e.preventDefault();
          const pass = document.getElementById('resetPassword').value;
          const confirmPass = document.getElementById('resetConfirmPassword').value;

          if (pass.length < 8) {
            document.getElementById('resetPassword').focus();
            if (window.showToast) {
              window.showToast('Password must be at least 8 characters long.', 'warning');
            }
            return;
          }

          if (pass !== confirmPass) {
            document.getElementById('resetConfirmPassword').focus();
            document.getElementById('resetConfirmPassword').classList.add('is-invalid');
            if (window.showToast) {
              window.showToast('New password and re-entered password do not match!', 'danger', 'Mismatch Detected');
            }
            return;
          }

          if (window.showToast) {
            window.showToast('Password reset successfully! Redirecting to login...', 'success', 'Password Updated');
          }
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1200);
        });
      }
    });
  </script>
</body>
</html>
