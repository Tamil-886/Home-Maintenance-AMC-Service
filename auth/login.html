<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HomeCarely Customer & Admin Portal</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231068eb'><path d='M12 2L2 7v7c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm-1 15l-4-4 1.41-1.41L11 14.17l6.59-6.59L19 9l-8 8z'/></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="bg-soft-blue d-flex flex-column min-vh-100 justify-content-between">

  <!-- Top bar -->
  <header class="py-3 border-bottom bg-white auth-header">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="brand-logo text-decoration-none" href="../index.html">
        <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
        <span>HomeCare<span class="text-primary">ly</span></span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <!-- RTL / LTR Direction Switcher -->
        <button class="btn btn-sm btn-outline-hc dir-toggle-btn py-1-5 px-3 small d-inline-flex align-items-center" title="Toggle RTL / LTR layout" aria-label="Toggle RTL / LTR">
          <i class="bi bi-globe me-1 text-primary"></i> <span class="dir-toggle-text">RTL</span>
        </button>

        <!-- Dark Mode Toggle Button -->
        <button class="btn btn-icon-pill theme-toggle-btn d-inline-flex" title="Toggle Theme" aria-label="Toggle Dark Mode">
          <i class="bi bi-moon-stars-fill text-primary"></i>
        </button>

        <a href="../index.html" class="btn btn-sm btn-outline-hc ms-1 d-inline-flex align-items-center gap-1">
          <i class="bi bi-arrow-left"></i> <span>Back to Website</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Login Card Form Container -->
  <main class="my-auto py-5">
    <div class="container" style="max-width: 490px;">

      <!-- Main Login Box -->
      <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 bg-white auth-card">
        <div class="text-center mb-4">
          <h3 class="fw-bold mb-1">Welcome Back</h3>
          <p class="text-muted small">Access your maintenance visits, AMC contracts, or administrative console.</p>
        </div>

        <!-- Dynamic Success & Error Alert Box -->
        <div id="loginAlertBox" class="alert d-none mb-4" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <div class="input-icon-group">
              <i class="bi bi-envelope"></i>
              <input type="email" class="form-control form-control-hc" id="loginEmail" placeholder="name@example.com" required autocomplete="username">
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label class="form-label small fw-semibold mb-0">Password</label>
              <a href="forgot-password.html" class="small text-primary text-decoration-none">Forgot Password?</a>
            </div>
            <div class="input-icon-group mt-1">
              <i class="bi bi-lock"></i>
              <input type="password" class="form-control form-control-hc" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" class="password-toggle-btn" id="togglePassBtn" onclick="togglePasswordVisibility('#loginPassword', '#passToggleIcon')" title="Toggle password visibility" tabindex="-1">
                <i class="bi bi-eye" id="passToggleIcon"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" checked>
              <label class="form-check-label small text-muted" for="rememberMe">Remember my login</label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-hc w-100 justify-content-center py-3 mb-3">
            Sign In <i class="bi bi-box-arrow-in-right"></i>
          </button>

          <div class="text-center text-muted small">
            Don't have an AMC plan yet? <a href="register.html" class="fw-semibold text-primary">Create an account</a>
          </div>
        </form>
      </div>

    </div>
  </main>

  <footer class="py-3 border-top text-center text-muted small bg-white auth-footer">
    <div class="container">
      © 2026 HomeCarely AMC Services Ltd. Frontend LocalStorage Demonstration.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/validation.js"></script>
  <script src="../assets/js/auth.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('loginForm');
      const alertBox = document.getElementById('loginAlertBox');

      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();

          const emailInput = document.getElementById('loginEmail');
          const passInput = document.getElementById('loginPassword');
          const email = emailInput ? emailInput.value.trim() : '';
          const pass = passInput ? passInput.value.trim() : '';

          // Reset alert
          if (alertBox) {
            alertBox.className = 'alert d-none mb-4';
            alertBox.innerHTML = '';
          }

          // Validate required fields
          if (!email || !pass) {
            if (alertBox) {
              alertBox.className = 'alert alert-danger d-flex align-items-center gap-2 border-0 shadow-sm rounded-3 py-3 px-3 text-danger bg-danger-subtle mb-4';
              alertBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0"></i><div><span class="fw-bold d-block">Validation Error</span><span class="small">Please enter both email address and password.</span></div>';
            }
            if (window.showToast) {
              window.showToast('Please enter both email and password.', 'danger', 'Validation Error');
            }
            return;
          }

          // Validate credentials using HomeCarelyAuth
          const result = window.HomeCarelyAuth.login(email, pass);

          if (result.success) {
            // Display clear success message on the existing Login page itself
            if (alertBox) {
              alertBox.className = 'alert alert-success d-flex align-items-center gap-2 border-0 shadow-sm rounded-3 py-3 px-3 fw-semibold text-success bg-success-subtle mb-4';
              alertBox.innerHTML = '<i class="bi bi-check-circle-fill fs-5 flex-shrink-0"></i><div><span class="fs-6 fw-bold d-block">Login Successful!</span><span class="small fw-normal text-success-emphasis">Welcome back, ' + (result.user.name || 'User') + '. You have logged in successfully.</span></div>';
            }

            if (window.showToast) {
              window.showToast('Login Successful!', 'success', 'Login Successful!');
            }

            // CRITICAL: Keep user on the same Login page.
            // Do NOT redirect to Customer Dashboard.
            // Do NOT redirect to Admin Dashboard.
            // Do NOT redirect to Home page.
            // Do NOT redirect to any other page.
            // Do NOT automatically refresh or reload the page.
            // Do NOT automatically close the Login form.
          } else {
            // Display invalid credentials error message
            if (alertBox) {
              alertBox.className = 'alert alert-danger d-flex align-items-center gap-2 border-0 shadow-sm rounded-3 py-3 px-3 text-danger bg-danger-subtle mb-4';
              alertBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0"></i><div><span class="fw-bold d-block">Login Failed</span><span class="small">' + (result.message || 'Invalid email or password.') + '</span></div>';
            }

            if (window.showToast) {
              window.showToast(result.message || 'Invalid email or password.', 'danger', 'Login Failed');
            }
          }
        });
      }
    });
  </script>
</body>
</html>
