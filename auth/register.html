<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Create Your HomeCarely Account</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231068eb'><path d='M12 2L2 7v7c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm-1 15l-4-4 1.41-1.41L11 14.17l6.59-6.59L19 9l-8 8z'/></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="bg-soft-blue d-flex flex-column min-vh-100 justify-content-between">

  <!-- Header -->
  <header class="py-3 border-bottom bg-white auth-header">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="brand-logo text-decoration-none" href="../index.html">
        <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
        <span>HomeCare<span class="text-primary">ly</span></span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <!-- RTL / LTR Direction Switcher -->
        <button class="btn btn-sm btn-outline-hc dir-toggle-btn py-1-5 px-3 small d-inline-flex align-items-center" title="Toggle RTL / LTR layout" aria-label="Toggle RTL / LTR">
          <i class="bi bi-globe me-1 text-primary"></i> <span class="dir-toggle-text">RTL</span>
        </button>

        <!-- Dark Mode Toggle Button -->
        <button class="btn btn-icon-pill theme-toggle-btn d-inline-flex" title="Toggle Theme" aria-label="Toggle Dark Mode">
          <i class="bi bi-moon-stars-fill text-primary"></i>
        </button>

        <a href="login.html" class="btn btn-sm btn-outline-hc ms-1 d-inline-flex align-items-center gap-1">
          <i class="bi bi-box-arrow-in-right"></i> <span>Log In</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Register Form Container -->
  <main class="my-auto py-5">
    <div class="container" style="max-width: 540px;">
      <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 bg-white auth-card">
        <div class="text-center mb-4">
          <span class="badge-tag bg-primary-subtle text-primary mb-2">Homeowner Registration</span>
          <h3 class="fw-bold mb-1">Create Your Account</h3>
          <p class="text-muted small">Begin your annual maintenance coverage with a complimentary 120-point digital home health audit.</p>
        </div>

        <form id="registerForm">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label small fw-semibold">Full Name</label>
              <div class="input-icon-group">
                <i class="bi bi-person"></i>
                <input type="text" class="form-control form-control-hc" id="regFullName" placeholder="e.g. Eleanor Vance" required>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold">Email Address</label>
              <div class="input-icon-group">
                <i class="bi bi-envelope"></i>
                <input type="email" class="form-control form-control-hc" id="regEmail" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold">Phone Number</label>
              <div class="input-icon-group">
                <i class="bi bi-telephone"></i>
                <input type="tel" class="form-control form-control-hc" id="regPhone" placeholder="+1 (555) 000-0000" required>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold">Select Initial AMC Package</label>
              <select class="form-select form-control-hc" id="regPlan" required>
                <option value="Basic Plan">Basic Plan ($199/yr - 2 Visits)</option>
                <option value="Standard Plan">Standard Plan ($349/yr - 4 Visits)</option>
                <option value="Premium Plan" selected>Premium Plan ($599/yr - 8 Visits + Unlimited Emergency)</option>
                <option value="Comprehensive Plan">Comprehensive VIP Plan ($999/yr)</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold" for="regPassword">Password</label>
              <div class="input-icon-group">
                <i class="bi bi-lock"></i>
                <input type="password" class="form-control form-control-hc" id="regPassword" placeholder="Min. 8 characters" minlength="8" required autocomplete="new-password">
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('#regPassword', '#regPassToggleIcon')" title="Toggle password visibility" tabindex="-1">
                  <i class="bi bi-eye" id="regPassToggleIcon"></i>
                </button>
              </div>
              <div id="regPassFeedback" class="small mt-1" style="min-height: 1.25rem;"></div>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold" for="regConfirmPassword">Confirm Password</label>
              <div class="input-icon-group">
                <i class="bi bi-shield-lock"></i>
                <input type="password" class="form-control form-control-hc" id="regConfirmPassword" placeholder="Re-enter password" minlength="8" required autocomplete="new-password">
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('#regConfirmPassword', '#regConfirmPassToggleIcon')" title="Toggle password visibility" tabindex="-1">
                  <i class="bi bi-eye" id="regConfirmPassToggleIcon"></i>
                </button>
              </div>
              <div id="regConfirmPassFeedback" class="small mt-1" style="min-height: 1.25rem;"></div>
            </div>

            <div class="col-12">
              <div class="form-check mt-1">
                <input class="form-check-input" type="checkbox" id="regAgree" checked required>
                <label class="form-check-label small text-muted" for="regAgree">
                  I agree to the <a href="../faq.html" class="text-primary">Terms of Service</a> and <a href="../faq.html" class="text-primary">AMC Privacy Policy</a>.
                </label>
              </div>
            </div>

            <div class="col-12 mt-3">
              <button type="submit" class="btn btn-primary-hc w-100 justify-content-center py-3">
                Register & Open Customer Dashboard <i class="bi bi-arrow-right"></i>
              </button>
            </div>
          </div>

          <div class="text-center text-muted small mt-4 pt-3 border-top">
            Already have an account? <a href="login.html" class="fw-semibold text-primary">Log in here</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-3 border-top text-center text-muted small bg-white auth-footer">
    <div class="container">
      © 2026 HomeCarely AMC Services Ltd.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/validation.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/subscription.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('registerForm');
      const passInput = document.getElementById('regPassword');
      const confirmPassInput = document.getElementById('regConfirmPassword');

      // Initialize real-time validator
      const validator = window.initPasswordMatchValidator('#regPassword', '#regConfirmPassword', '#regPassFeedback', '#regConfirmPassFeedback');

      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();

          const name = document.getElementById('regFullName').value.trim();
          const email = document.getElementById('regEmail').value.trim();
          const phone = document.getElementById('regPhone').value.trim();
          const plan = document.getElementById('regPlan').value;
          const pass = passInput.value;
          const confirmPass = confirmPassInput.value;

          // 1. Check given password length
          if (pass.length < 8) {
            passInput.focus();
            passInput.classList.add('is-invalid');
            if (window.showToast) {
              window.showToast('Password is too short. Please provide at least 8 characters.', 'warning', 'Password Validation');
            }
            return;
          }

          // 2. Check password and re-entered password match
          if (pass !== confirmPass) {
            confirmPassInput.focus();
            confirmPassInput.classList.add('is-invalid');
            if (window.showToast) {
              window.showToast('Passwords do not match! Please check your given password and re-enter it correctly.', 'danger', 'Mismatch Detected');
            }
            return;
          }

          const res = window.HomeCarelyAuth.register(name, email, pass, phone, plan);
          if (res.success) {
            if (window.showToast) {
              window.showToast(`Account created for ${name}! Initializing your dashboard...`, 'success', 'Welcome to HomeCarely');
            }
            setTimeout(() => {
              window.location.href = '../customer/dashboard.html';
            }, 1000);
          } else {
            if (window.showToast) window.showToast(res.message, 'danger');
          }
        });
      }
    });
  </script>
</body>
</html>
